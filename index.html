<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockCraft Survival</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="app">
      <canvas id="game" aria-label="BlockCraft Survival"></canvas>

      <section id="start-screen" class="panel">
        <h1>BlockCraft Survival</h1>
        <p>Di bo, nhay, pha, dat khoi, che tao do va song sot voi mob.</p>
        <div class="panel-actions">
          <button id="start-button" type="button">Bat dau</button>
          <button id="flight-toggle" class="secondary-button" type="button">Creative flight: Tat</button>
        </div>
      </section>

      <section id="hud" aria-label="HUD">
        <div id="status">
          <span id="mode">Paused</span>
          <span id="fps">0 FPS</span>
          <span id="count">0 blocks</span>
        </div>
        <div id="tips">WASD di chuyen | Chuot nhin | Space nhay | Shift chay | E inventory | Esc pause | Click trai pha/danh | Click phai dat/an</div>
      </section>

      <div id="health-hud" aria-label="Health"></div>
      <div id="break-hud" class="hidden"><div class="break-fill"></div></div>

      <div id="mob-info" class="mob-info hidden">
        <div class="mob-name"></div>
        <div class="mob-kind"></div>
        <div class="mob-health"><span></span></div>
      </div>

      <div id="crosshair" aria-hidden="true"></div>
      <div id="hotbar" aria-label="Hotbar"></div>

      <section id="inventory" class="inventory hidden" aria-label="Inventory">
        <div class="inventory-panel">
          <div class="inventory-head">
            <h2>Inventory</h2>
            <button id="inventory-close" type="button">Dong</button>
          </div>

          <div class="inventory-body">
            <section class="inventory-section">
              <div class="inventory-section-title">Do dang co</div>
              <div id="inventory-grid"></div>
            </section>

            <section class="crafting-panel">
              <div class="inventory-section-title">Che tao</div>
              <div id="recipe-grid"></div>
              <div id="crafting-output" class="crafting-output">
                <div class="swatch"></div>
                <div class="recipe-result">Chon cong thuc</div>
                <div class="recipe-cost">Can nguyen lieu</div>
              </div>
              <button id="craft-button" class="craft-button" type="button" disabled>Che tao</button>
            </section>
          </div>
        </div>
      </section>

      <div id="mobile-controls" aria-hidden="true">
        <div id="mobile-look"></div>
        <div id="mobile-joystick">
          <div id="mobile-stick"></div>
        </div>
        <div id="mobile-actions">
          <button class="mobile-btn small" type="button" data-mobile-action="inventory">Tui</button>
          <button class="mobile-btn small" type="button" data-mobile-action="jump">Nhay</button>
          <button class="mobile-btn small" type="button" data-mobile-action="run">Chay</button>
          <button class="mobile-btn" type="button" data-mobile-action="break">Pha</button>
          <button class="mobile-btn" type="button" data-mobile-action="place">Dat</button>
          <button class="mobile-btn" type="button" data-mobile-action="eat">An</button>
        </div>
      </div>
    </main>

    <script>
      (() => {
        const startScreen = document.querySelector("#start-screen");
        const startButton = document.querySelector("#start-button");
        const version = "20260530-3";

        function loadScript(src, done) {
          const script = document.createElement("script");
          script.src = src;
          script.onload = () => done(true);
          script.onerror = () => done(false);
          document.head.appendChild(script);
        }

        function showError() {
          startScreen.querySelector("p").textContent =
            "Khong tai duoc Three.js hoac app.js. Kiem tra file vendor/three.min.js va app.js.";
          startButton.disabled = true;
          startButton.textContent = "Loi file";
        }

        loadScript(`./vendor/three.min.js?v=${version}`, () => {
          if (window.THREE) {
            loadScript(`./app.js?v=${version}`, (ok) => {
              if (!ok) showError();
            });
            return;
          }

          loadScript("https://unpkg.com/three@0.160.0/build/three.min.js", () => {
            if (window.THREE) {
              loadScript(`./app.js?v=${version}`, (ok) => {
                if (!ok) showError();
              });
            } else {
              showError();
            }
          });
        });
      })();
    </script>
  </body>
</html>
